<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<title>Tab Sound Recorder</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <h1>Tab Sound Recorder</h1>
    <span class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></span>
  </header>

  <section class="panel">
    <p class="label" id="sourceLabel">This tab</p>
    <p class="source" id="source">…</p>
    <p class="timer" id="timer">00:00</p>
  </section>

  <button class="btn primary big" id="toggle" type="button">
    <svg id="iconRec" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="7"/></svg>
    <svg id="iconStop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><rect width="14" height="14" x="5" y="5" rx="2"/></svg>
    <span id="toggleText">Start recording</span>
  </button>
  <p class="message" id="message" role="status"></p>

  <section class="settings" id="settings">
    <div class="field">
      <span class="label" id="formatLabel">File type</span>
      <div class="segmented" role="radiogroup" aria-labelledby="formatLabel">
        <label><input type="radio" name="format" value="wav"><span>WAV</span></label>
        <label><input type="radio" name="format" value="webm"><span>WebM</span></label>
      </div>
      <p class="hint" id="formatHint"></p>
    </div>

    <div class="field">
      <span class="label">Where to save</span>
      <label class="choice"><input type="radio" name="where" value="ask"><span><b>Ask me each time</b><span class="muted">Pick any folder and name when you stop.</span></span></label>
      <label class="choice"><input type="radio" name="where" value="auto"><span><b>Save straight away</b><span class="muted">Into a folder inside Downloads, no questions.</span></span></label>
      <div class="folder" id="folderRow">
        <span class="muted">Downloads /</span>
        <input id="folder" type="text" spellcheck="false" placeholder="Recordings" aria-label="Folder inside Downloads">
      </div>
    </div>
  </section>

  <script src="popup.js"></script>
</body>
</html>
